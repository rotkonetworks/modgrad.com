# modgrad.com: nginx inside the modgrad-com container (conf.d, i.e. inside http {}).
# Installed by .github/workflows/deploy.yaml; behind the host's TLS-terminating haproxy.
#   /        the static site (dist/)
#   /api/    modgrad-api (contact form, node) on the modgrad-net podman network
#   /app/    modgrad-app (modgrad-server: dashboard, sign-in, /app/api/v1, /app/mcp)

# /app/ → modgrad-app with the prefix stripped from the RAW request URI. proxy_pass with a
# URI part (or a rewrite) would pass the normalized, percent-DECODED path, turning run ids
# sent as proj%2Frun (GET /api/runs/<id>/metrics/…) into extra path segments.
map $request_uri $modgrad_app_uri {
    ~^/app(?<rest>/.*)$ $rest;
    default /;
}
# websocket-safe upgrade; empty Connection otherwise (keepalive to the upstream)
map $http_upgrade $modgrad_app_connection {
    default upgrade;
    ''      '';
}
# the scheme the client used: haproxy's X-Forwarded-Proto when it sends one
map $http_x_forwarded_proto $modgrad_app_proto {
    default $http_x_forwarded_proto;
    ''      $scheme;
}
# resolved when nginx starts: modgrad-app must be running first (the workflow starts it first)
upstream modgrad_app {
    server modgrad-app:8790;
    keepalive 16;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Behind the TLS-terminating haproxy: emit RELATIVE redirects so a
    # trailing-slash redirect (e.g. /play → /play/) keeps the https
    # scheme instead of downgrading to http:// (mixed-content abort).
    absolute_redirect off;
    port_in_redirect off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/javascript application/xml+rss application/json image/svg+xml;

    # contact form → JMAP service on the shared network
    location /api/ {
        proxy_pass http://modgrad-api:3001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # the observability app (modgrad-server --public-url https://modgrad.com/app).
    # ^~ so the asset regex below never serves /app/*.js from the static root.
    location = /app {
        return 301 /app/;
    }
    location ^~ /app/ {
        proxy_pass http://modgrad_app$modgrad_app_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $modgrad_app_connection;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $modgrad_app_proto;
        proxy_set_header X-Forwarded-Prefix /app;
        # the sign-in mail rate limit is per client: take the client from haproxy's
        # X-Forwarded-For when the hop before us is private (haproxy/podman), not its address
        set_real_ip_from 10.0.0.0/8;
        set_real_ip_from 172.16.0.0/12;
        set_real_ip_from 192.168.0.0/16;
        set_real_ip_from 127.0.0.0/8;
        set_real_ip_from fc00::/7;
        real_ip_header X-Forwarded-For;
        real_ip_recursive on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # live boards are Server-Sent Events (/app/api/v1/stream, …/runs/<id>/stream): pass every
        # event through as it comes (the server also sends X-Accel-Buffering: no), and let a
        # quiet stream live (the server sends keep-alive comments well inside this)
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        # row batches: the server takes bodies up to 2 MiB
        client_max_body_size 4m;
    }

    # /play runs the modgrad wasm engine across browser cores (rayon +
    # SharedArrayBuffer). That needs a cross-origin-isolated document, which
    # requires COOP+COEP on the /play HTML response. Scope it to this route
    # ONLY so the rest of the site (and the contact form under /api/) keeps
    # its normal, non-isolated context. SPA route → served as index.html.
    location /play {
        add_header Cross-Origin-Opener-Policy "same-origin" always;
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        try_files $uri $uri/ /index.html;
    }

    # engine assets (wasm, glue js, rayon worker) load as subresources of the
    # isolated /play document. ^~ stops the regex asset block below from
    # winning for /engine/*.js, so CORP is applied. All same-origin already,
    # but CORP makes the isolation explicit and future-proofs a CDN move.
    location ^~ /engine/ {
        # rayon spawns its workerHelpers.js as nested workers from inside
        # the (require-corp) engine worker. A worker created in a
        # require-corp context must itself assert COEP: require-corp, not
        # just carry CORP — otherwise it is blocked (ERR_BLOCKED_BY_RESPONSE).
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        # The Vite-bundled engine Web Worker ships under /assets/worker-*.js.
        # A dedicated worker created in the require-corp /play context must
        # itself assert COEP: require-corp AND pass the CORP check, or it is
        # blocked (ERR_BLOCKED_BY_RESPONSE) and the page hangs on "loading".
        # These headers are meaningful only for the worker script; on plain
        # js/css/img responses they are inert. same-origin CORP only blocks
        # cross-site hotlinking of our own assets, which is fine here.
        add_header Cross-Origin-Embedder-Policy "require-corp" always;
        add_header Cross-Origin-Resource-Policy "same-origin" always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
}
