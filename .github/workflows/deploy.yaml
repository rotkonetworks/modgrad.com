name: Deploy modgrad.com

on:
  push:
    branches: [master]
  workflow_dispatch:

env:
  CONTAINER_NAME: modgrad-com
  API_CONTAINER: modgrad-api
  # modgrad-server (deploy/obs/Containerfile): the dashboard, sign-in and API under /app
  APP_CONTAINER: modgrad-app
  APP_VOLUME: modgrad-app-data
  APP_PUBLIC_URL: https://modgrad.com/app
  # the SSH door (python train.py | ssh -p 2222 modgrad.com); see the run step
  APP_SSH_PORT: 2222
  # cargo parallelism for the image build on the host (keep modest)
  NETWORK: modgrad-net
  CONTAINER_PORT: 55560
  API_PORT: 3001
  PROJECT_DIR: modgrad.com
  NODE_VERSION: "20"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3

      - uses: actions/setup-node@v3
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build site
        run: |
          npm install
          npm run build

          if [ ! -f dist/index.html ]; then
            echo "Build failed: no index.html found"
            exit 1
          fi

          # The app image is rebuilt only when its sources change: tag it with
          # a hash of the trees that go into it.
          echo "APP_SRC=$(git ls-tree -r HEAD -- Cargo.toml Cargo.lock .containerignore crates obs/web deploy/obs | sha256sum | cut -c1-16)" >> "$GITHUB_ENV"

          # ship the static site, the node services and the nginx config; the app
          # image is built below, on this runner (the host has 2 cores and ~1 GB)
          tar czf site.tar.gz dist/ server/ deploy/

      - uses: docker/setup-buildx-action@v3

      # modgrad-server + CLI (native) and the dashboard with its wasm, in one
      # image; layers and the cargo cache mounts persist in the Actions cache
      - name: Build app image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/obs/Containerfile
          build-args: JOBS=4
          tags: localhost/${{ env.APP_CONTAINER }}:${{ env.APP_SRC }}
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save app image
        run: docker save localhost/${{ env.APP_CONTAINER }}:${{ env.APP_SRC }} | gzip > app-image.tar.gz && ls -lh app-image.tar.gz

      - name: Upload site
        uses: appleboy/scp-action@v0.1.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          source: site.tar.gz,app-image.tar.gz
          target: /home/${{ secrets.DEPLOY_USER }}/

      - name: Deploy containers
        uses: appleboy/ssh-action@v1.0.0
        env:
          JMAP_URL: ${{ secrets.JMAP_URL }}
          JMAP_USER: ${{ secrets.JMAP_USER }}
          JMAP_PASS: ${{ secrets.JMAP_PASS }}
          APP_SRC: ${{ env.APP_SRC }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          envs: JMAP_URL,JMAP_USER,JMAP_PASS,APP_SRC
          command_timeout: 15m
          script: |
            set -e
            cd /home/${{ secrets.DEPLOY_USER }}

            # Clear the prior extraction FIRST: tar is additive, so a file
            # removed from the repo would otherwise linger in the server-side
            # tree across deploys and get carried into PROJECT_DIR by cp -a.
            rm -rf dist server modgrad-src
            mkdir modgrad-src
            tar xzf site.tar.gz -C modgrad-src
            # zsh aborts on globs that match nothing — avoid PROJECT_DIR/* and dist/*
            rm -rf ${{ env.PROJECT_DIR }}
            mkdir -p ${{ env.PROJECT_DIR }}
            cp -a modgrad-src/dist/. ${{ env.PROJECT_DIR }}/

            # the nginx config lives in the repo: deploy/nginx/modgrad.conf
            cp modgrad-src/deploy/nginx/modgrad.conf nginx-modgrad.conf

            # shared network for nginx ↔ api
            podman network exists ${{ env.NETWORK }} || podman network create ${{ env.NETWORK }}

            # ── modgrad-app: modgrad-server + the dashboard, at https://modgrad.com/app ──
            # Built on the Actions runner and shipped as app-image.tar.gz, tagged
            # with APP_SRC (a hash of the trees that go into it); loaded only when
            # this host does not have that tag yet.
            : "${APP_SRC:?APP_SRC (the app source hash) was not passed}"
            APP_IMAGE=localhost/${{ env.APP_CONTAINER }}:$APP_SRC
            if ! podman image exists "$APP_IMAGE"; then
              gunzip -c app-image.tar.gz | podman load
              podman tag "$APP_IMAGE" localhost/${{ env.APP_CONTAINER }}:latest
            fi
            rm -f app-image.tar.gz
            # accounts, sessions, tokens, runs, boards and the SSH host key; back it up
            podman volume exists ${{ env.APP_VOLUME }} || podman volume create ${{ env.APP_VOLUME }}
            podman stop ${{ env.APP_CONTAINER }} 2>/dev/null || true
            podman rm ${{ env.APP_CONTAINER }} 2>/dev/null || true
            # Sign-in mail goes out through the same Stalwart account as the contact
            # form (From = JMAP_USER). The secrets go in by name (-e VAR), not on the
            # command line. HTTP/3 is off (no --h3): QUIC would need a UDP port and a
            # certificate on this host.
            # SSH door: published on the host's port APP_SSH_PORT. It is reachable
            # from outside only once the OPERATOR forwards that TCP port to this
            # host in the firewall / haproxy (plain TCP, not HTTP). Until then the
            # sign-in page shows an `ssh -p 2222 modgrad.com login` that does not connect.
            MODGRAD_JMAP_URL="${JMAP_URL%/}/.well-known/jmap" \
            MODGRAD_JMAP_USER="$JMAP_USER" \
            MODGRAD_JMAP_PASS="$JMAP_PASS" \
            podman run -d \
              --name ${{ env.APP_CONTAINER }} \
              --network ${{ env.NETWORK }} \
              -p ${{ env.APP_SSH_PORT }}:2222 \
              -v ${{ env.APP_VOLUME }}:/data \
              -e MODGRAD_JMAP_URL -e MODGRAD_JMAP_USER -e MODGRAD_JMAP_PASS \
              --restart unless-stopped \
              "$APP_IMAGE" \
              --public-url ${{ env.APP_PUBLIC_URL }} \
              --mail jmap \
              --ssh 0.0.0.0:2222 \
              --mcp
            # nginx resolves modgrad-app when it starts: refuse to go on (and leave
            # the running nginx alone) if the app did not come up
            sleep 3
            if [ "$(podman inspect -f '{{.State.Running}}' ${{ env.APP_CONTAINER }} 2>/dev/null)" != "true" ]; then
              echo "modgrad-app failed to start"
              podman logs ${{ env.APP_CONTAINER }}
              exit 1
            fi
            # keep the current image and :latest; drop older source-hash tags
            podman images --format '{{.Repository}}:{{.Tag}}' \
              | grep '/${{ env.APP_CONTAINER }}:' | grep -v ":$APP_SRC\$" | grep -v ':latest$' \
              | xargs -r podman rmi 2>/dev/null || true

            # build + (re)start the contact-form service
            podman build -t ${{ env.API_CONTAINER }}:latest ./modgrad-src/server
            podman stop ${{ env.API_CONTAINER }} 2>/dev/null || true
            podman rm ${{ env.API_CONTAINER }} 2>/dev/null || true
            podman run -d \
              --name ${{ env.API_CONTAINER }} \
              --network ${{ env.NETWORK }} \
              -e JMAP_URL="$JMAP_URL" \
              -e JMAP_USER="$JMAP_USER" \
              -e JMAP_PASS="$JMAP_PASS" \
              -e MAIL_FROM="noreply@rotko.net" \
              -e MAIL_TO="modgrad@rotko.net" \
              -e PORT="${{ env.API_PORT }}" \
              --restart unless-stopped \
              ${{ env.API_CONTAINER }}:latest

            # (re)start nginx on the same network — free the http port first
            podman stop ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            podman rm -f ${{ env.CONTAINER_NAME }} 2>/dev/null || true
            # remove any other container still publishing the port (e.g. a prior manual deploy)
            for c in $(podman ps -a --format '{{.ID}} {{.Ports}}' | grep ':${{ env.CONTAINER_PORT }}->' | awk '{print $1}'); do
              podman rm -f "$c" 2>/dev/null || true
            done
            sleep 2
            podman run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --network ${{ env.NETWORK }} \
              -p 127.0.0.1:${{ env.CONTAINER_PORT }}:80 \
              -v /home/${{ secrets.DEPLOY_USER }}/${{ env.PROJECT_DIR }}:/usr/share/nginx/html:ro,Z \
              -v /home/${{ secrets.DEPLOY_USER }}/nginx-modgrad.conf:/etc/nginx/conf.d/default.conf:ro,Z \
              --restart unless-stopped \
              nginx:alpine

            sleep 2
            if ! podman ps | grep -q ${{ env.CONTAINER_NAME }}; then
              echo "nginx failed to start"
              podman logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi

            curl -f http://127.0.0.1:${{ env.CONTAINER_PORT }}/ > /dev/null || {
              echo "Site not responding"
              podman logs ${{ env.CONTAINER_NAME }}
              exit 1
            }

            # confirm the form proxy is wired (health check needs no JMAP creds)
            if ! curl -fs http://127.0.0.1:${{ env.CONTAINER_PORT }}/api/health | grep -q '"ok":true'; then
              echo "Contact API not responding through nginx"
              podman logs ${{ env.API_CONTAINER }}
              exit 1
            fi

            # the app through nginx: sign-in methods (API) and the dashboard page
            if ! curl -fs http://127.0.0.1:${{ env.CONTAINER_PORT }}/app/api/v1/auth/methods | grep -q '"email":true'; then
              echo "modgrad-app API not responding through nginx at /app/"
              podman logs --tail 50 ${{ env.APP_CONTAINER }}
              exit 1
            fi
            curl -fs http://127.0.0.1:${{ env.CONTAINER_PORT }}/app/ | grep -q 'id="app"' || {
              echo "modgrad-app dashboard not served at /app/"
              exit 1
            }

            rm -f site.tar.gz
            rm -rf modgrad-src

            echo "Deployment successful"
