[package]
name = "modgrad-mini"
version = "0.1.0"
edition = "2021"
description = "Standalone faithful reimplementation of the modgrad CTM forward pass for in-browser demos."
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = []
wasm = ["dep:wasm-bindgen", "dep:serde-wasm-bindgen"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pinned to the installed `wasm-bindgen` CLI version: the CLI generates the JS
# glue, and a newer crate emits imports (e.g. __wbindgen_cast_*) that the older
# CLI's glue won't provide → "function import requires a callable" at instantiate.
wasm-bindgen = { version = "=0.2.114", optional = true }
serde-wasm-bindgen = { version = "0.6", optional = true }

[profile.release]
opt-level = 3
lto = true
