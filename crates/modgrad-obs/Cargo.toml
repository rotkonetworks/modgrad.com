[package]
name = "modgrad-obs"
version = "0.1.0"
edition = "2024"
description = "Append-only experiment observability for the modgrad SDK: metrics, arrays, events, summaries as JSONL, plus a reader"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
