[package]
name = "modgrad-obs-wandb"
version = "0.1.0"
edition = "2024"
description = "Read and write Weights & Biases offline run files (run-<id>.wandb) for modgrad-obs runs, without the wandb SDK or wandb-core"
license = "MIT"

[dependencies]
modgrad-obs = { path = "../modgrad-obs" }
prost = "0.13"
serde_json = "1"
